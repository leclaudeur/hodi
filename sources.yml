# ==========================================
# Hodi sources: the themes, their sources, and the channels of "Écouter et regarder".
# Every field is described in docs/sources.md ("Fields"); in short:
#
# topics: one tab per theme.
#   id, label: the theme's id, and its name in every language (Tech) or per language ({ fr: Monde, en: World }).
#   young: [teen, child]: the kinds of young profiles that see this theme (none when missing).
#   sources: the theme's article feeds (RSS or Atom), each with:
#     id, name, url: the source's id, its name, and its feed's https address.
#     lang: the language it writes in, fr when missing.
#     domains: hosts Hodi may fetch article pages from, to show them in its reader. Articles that do not open
#       there (subscriber-only, too short) are hidden.
#     reader: false lists every article with its feed summary and a link to the site instead (no domains needed).
#     skip: paths whose pages are not articles (videos...), left out without being fetched.
#     base: [fr] and/or [en]: a base source for a household set up in that language, one every new profile starts
#       with. Every other source is only suggested in Réglages > Sources.
#     young: [teen, child]: in the catalogue of these young profiles, for their parents to turn on
#       (Réglages > Profils > Gérer > Sources).
#     young_base: [teen, child]: these young profiles start with it turned on (it is in their catalogue too).
#     adults: false: made for young readers, never suggested to the adults.
# listen: "Écouter et regarder", one section per theme (id, label, sources), with YouTube channels (kind: video,
#   the default here) and podcasts (kind: podcast), from the last 60 days. YouTube Shorts are left out.
#
# The file fills the database once, when the household is set up: later edits to its feeds change nothing on an
# existing install (a renamed theme shows after `docker compose restart app`). After an edit, run `npm run sources:list` to update docs/source-list.md.
# Check every feed from the server with:
#   docker compose exec app node dist/server/cli/check-sources.js
# ==========================================

topics:
  - id: belgium
    label: { fr: Belgique, en: Belgium }
    young: [teen, child]
    # r/belgium is left out: many posts are in Dutch.
    sources:
      # Made for young readers: their parents turn them on (Réglages > Profils > Gérer), never offered to adults.
      - id: jde
        name: JDE
        url: https://www.lejde.be/feed/
        domains: [lejde.be]
        young: [child, teen]
        young_base: [child]
        adults: false
      - id: rtbf-info
        name: RTBF Info
        url: https://rss.rtbf.be/article/rss/highlight_rtbf_info-belgique.xml?source=internal
        domains: [rtbf.be]
      - id: la-libre
        name: La Libre
        url: https://www.lalibre.be/arc/outboundfeeds/rss/section/belgique/?outputType=xml
        domains: [lalibre.be]
      - id: rtl-info
        name: RTL info
        url: https://www.rtl.be/rss.xml
        base: [fr]
        domains: [rtl.be]
        young: [teen]
        young_base: [teen]
      # 7sur7 redirects every article to a consent page: the app shows its titles
      # and summaries from the feed, with a link to read the article on 7sur7.be.
      - id: 7sur7
        name: 7sur7
        url: https://www.7sur7.be/belgique/rss.xml
        base: [fr]
        reader: false
        young: [teen]
        young_base: [teen]
      - id: daardaar
        name: DaarDaar
        url: https://daardaar.be/feed/
        domains: [daardaar.be]
      # A household set up in English starts with this one. The Brussels Times (no feed since its site became a
      # web app) and Belga News Agency (feed gone, only stale press releases left) were dropped in November 2026.
      - id: vrt-nws-en
        name: VRT NWS
        url: https://www.vrt.be/vrtnws/en.rss.articles.xml
        lang: en
        base: [en]
        domains: [vrt.be, vrtnws.be]
      # BX1 refuses requests from the server.

