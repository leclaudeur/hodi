name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Git commit or tag (`git log -1 --oneline`).
  - type: dropdown
    id: install
    attributes:
      label: Install
      description: Where Hodi runs.
      options:
        - Docker on a computer
        - Docker on a server (VPS…)
        - Docker behind a tunnel or VPN
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs --tail=100 app`. Remove anything private first.
      render: text
