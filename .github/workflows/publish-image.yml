# ==========================================
# Publishes the Docker image ghcr.io/leclaudeur/hodi when a tag v<version> is pushed, for servers that cannot build it
# themselves, such as one managed through Portainer (compose.image.yml). Tagged with the version and latest, for Intel
# or AMD and ARM processors.
# ==========================================
name: Publish image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Only a tag the maintainer pushed goes out: write access alone (a token, an app) must not publish the image.
      - name: Tag pushed by the maintainer
        run: |
          if [ "$GITHUB_ACTOR" != "leclaudeur" ] || [ "$GITHUB_TRIGGERING_ACTOR" != "leclaudeur" ]; then
            echo "Only leclaudeur's tags are published (pushed by $GITHUB_ACTOR, run by $GITHUB_TRIGGERING_ACTOR)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag says which version goes out: v0.2.0 publishes only if package.json says 0.2.0.
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      # ARM servers (a Raspberry Pi, an Ampere VPS) need their own build, made here by emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/leclaudeur/hodi
          # latest follows the last version pushed, pre-releases included, so compose.image.yml always finds one.
          flavor: latest=true
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
